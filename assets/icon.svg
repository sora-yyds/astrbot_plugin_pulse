<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AstrBot Pulse icon</title>
  <desc id="desc">A pulse wave connecting an AI news spark and an Epic games tile.</desc>
  <defs>
